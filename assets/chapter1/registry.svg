  <g fill="#f4ead2" stroke="#9c8a69" stroke-width="1"><path d="M150 8 l8 4 -6 6 8 5 -7 6 9 5 -8 6 8 6 -9 6 8 6 -8 6 9 6 -10 4"/><path d="M128 10 l7 4 -6 6 8 5 -7 6 9 5 -8 6 8 6 -9 6 8 6 -8 6 9 6 -10 4"/></g>
  <path d="M30 20H120M28 32H110" stroke="#8a7a5c" stroke-width="1.4" opacity=".4"/>
</g>
<!-- tea glass in a holder with steam -->
<g transform="translate(900 470)">
  <path d="M18 30 Q8 0 26 -30 Q42 -60 30 -90" stroke="#e8e2d6" stroke-width="5" fill="none" opacity=".25" filter="url(#blur2)"/>
  <path d="M40 30 Q54 -2 40 -36 Q30 -64 46 -96" stroke="#e8e2d6" stroke-width="4" fill="none" opacity=".2" filter="url(#blur2)"/>
