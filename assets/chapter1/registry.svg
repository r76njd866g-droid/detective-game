<text x="525" y="252" font-family="Georgia,serif" font-size="64" fill="#2a2621" text-anchor="middle">18</text>
<!-- clock-like sign: registry plate -->
<rect x="735" y="170" width="160" height="56" rx="4" fill="#b79a5f" opacity=".85"/><text x="815" y="206" font-family="Georgia,serif" font-size="22" fill="#2a2116" text-anchor="middle">РЕГИСТРАТУРА</text>
