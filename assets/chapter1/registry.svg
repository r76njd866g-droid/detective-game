  <ellipse cx="62" cy="0" rx="62" ry="12" fill="#1b1b1a"/>
  <ellipse cx="62" cy="2" rx="52" ry="8" fill="#2e1e12"/>
  <circle cx="44" cy="2" r="4" fill="#ff8a3d" opacity=".9"/><circle cx="76" cy="0" r="3" fill="#ffb05e" opacity=".8"/>
  <g stroke="#2a2b29" stroke-width="2" opacity=".6"><path d="M20 20 L30 170M50 20 L52 176M80 20 L76 176M104 20 L94 170"/></g>
</g>
<rect width="1500" height="1000" fill="url(#vig)"/>
<rect width="1500" height="1000" filter="url(#grain)" opacity=".9"/>
</svg>
