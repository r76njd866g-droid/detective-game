  <path d="M4 70 H66 L60 128 H10Z" fill="none" stroke="#c9a25f" stroke-width="5"/>
  <path d="M66 82 q22 4 18 24 q-3 12 -20 10" fill="none" stroke="#c9a25f" stroke-width="5"/>
  <rect x="30" y="16" width="4" height="70" fill="#d8d8d0" transform="rotate(12 32 50)"/>
</g>
<!-- newspaper folded -->
<g transform="translate(1015 562) rotate(3)">
  <ellipse cx="110" cy="74" rx="120" ry="10" fill="#000" opacity=".3"/>
  <path d="M0 6 H222 L216 70 H6 Z" fill="#d6ccb4"/><path d="M0 6 H222 L220 18 H2Z" fill="#bfb398"/>
  <text x="110" y="34" font-family="Georgia,serif" font-size="16" fill="#2a2621" text-anchor="middle">ВЕЧЕРНИЙ КУРЬЕР</text>
  <g stroke="#5e5646" stroke-width="2"><path d="M12 44H100M12 52H96M12 60H88M120 44H208M120 52H204M120 60H196"/></g>
</g>
<!-- waste bin with smoke -->
<g transform="translate(1350 780)">
  <path d="M70 0 C40 -40 90 -80 60 -130 C40 -170 80 -200 70 -240" stroke="#c7c2b8" stroke-width="14" fill="none" opacity=".18" filter="url(#soft)"/>
  <path d="M84 -10 C110 -50 70 -90 96 -140" stroke="#c7c2b8" stroke-width="10" fill="none" opacity=".16" filter="url(#soft)"/>
  <ellipse cx="62" cy="186" rx="74" ry="12" fill="#000" opacity=".4"/>
