  <rect x="1115" y="255" width="40" height="125" fill="#4a3826"/><rect x="1158" y="262" width="34" height="118" fill="#2d3a45"/><rect x="1196" y="250" width="30" height="130" fill="#5e2e25"/><rect x="1230" y="258" width="44" height="122" fill="#6c5430"/><rect x="1278" y="252" width="30" height="128" fill="#3a4732"/><rect x="1312" y="266" width="38" height="114" fill="#4b2d22"/><rect x="1354" y="256" width="34" height="124" fill="#5d4a2c"/><rect x="1392" y="262" width="40" height="118" fill="#2e3944"/>
  <rect x="1115" y="430" width="140" height="125" fill="#3f2c1d"/><rect x="1262" y="420" width="36" height="135" fill="#59302a"/><rect x="1302" y="428" width="30" height="127" fill="#3a4630"/><rect x="1336" y="438" width="40" height="117" fill="#6a522c"/>
</g>
<g fill="#cdbb93" opacity=".55"><rect x="1120" y="140" width="24" height="8"/><rect x="1190" y="150" width="28" height="8"/><rect x="1262" y="150" width="32" height="8"/><rect x="1342" y="150" width="28" height="8"/><rect x="1235" y="300" width="34" height="8"/><rect x="1120" y="470" width="130" height="10"/></g>
