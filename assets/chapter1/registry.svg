  <path d="M0 22 Q80 -6 160 22 L150 34 Q80 12 10 34 Z" fill="#0b0b0b"/>
  <ellipse cx="6" cy="28" rx="14" ry="10" fill="#0b0b0b"/><ellipse cx="154" cy="28" rx="14" ry="10" fill="#0b0b0b"/>
</g>
<!-- booking telegram under the lamp -->
<g transform="translate(338 604) rotate(-4)">
  <rect width="104" height="44" fill="url(#paperG)"/><rect width="104" height="10" fill="#c5b07f"/>
  <g stroke="#6b5c43" stroke-width="2"><path d="M8 20H90M8 28H72M8 36H84"/></g>
  <text x="92" y="39" font-family="Georgia,serif" font-size="11" fill="#7a2f28">204</text>
</g>
<!-- open ledger with torn stubs -->
<g transform="translate(525 548)">
  <ellipse cx="170" cy="78" rx="180" ry="12" fill="#000" opacity=".35"/>
