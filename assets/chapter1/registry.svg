<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
<title>Регистратура архива, 18 октября, утро</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2722"/><stop offset=".55" stop-color="#22322b"/><stop offset="1" stop-color="#16201b"/></linearGradient>
  <linearGradient id="wains" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#1e150d"/></linearGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f9fa6"/><stop offset=".6" stop-color="#5d6f78"/><stop offset="1" stop-color="#3e4d55"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3c24"/><stop offset="1" stop-color="#3b2516"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2516"/><stop offset="1" stop-color="#1c110a"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21170f"/><stop offset="1" stop-color="#0d0906"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd38a" stop-opacity=".55"/><stop offset=".5" stop-color="#ffb35c" stop-opacity=".16"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".5" cy=".48" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></radialGradient>
  <linearGradient id="paperG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efe3c8"/><stop offset="1" stop-color="#c9b58f"/></linearGradient>
  <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#3b3f3c"/><stop offset=".45" stop-color="#7b807a"/><stop offset="1" stop-color="#2b2e2c"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .09 0"/></filter>
</defs>
<rect width="1500" height="1000" fill="url(#wall)"/>
<!-- wall panels -->
<g stroke="#2f4038" stroke-width="3" fill="none" opacity=".6"><rect x="400" y="80" width="250" height="380"/><rect x="690" y="80" width="250" height="380"/></g>
<!-- window -->
<rect x="52" y="78" width="290" height="400" fill="#2a1d12"/>
<rect x="68" y="94" width="258" height="368" fill="url(#win)"/>
<g stroke="#a9b8bd" stroke-opacity=".35" stroke-width="1.5">
  <path d="M90 110l-14 60M130 140l-14 60M175 105l-14 60M220 160l-14 60M265 120l-14 60M300 190l-14 60M110 250l-14 60M160 300l-14 60M210 260l-14 60M255 330l-14 60M300 300l-14 60M120 380l-12 50M190 390l-12 50M280 400l-12 50"/>
</g>
<path d="M68 370 Q140 340 200 360 T326 350 V462 H68Z" fill="#33424a" opacity=".8"/>
<rect x="191" y="94" width="10" height="368" fill="#2a1d12"/><rect x="68" y="272" width="258" height="10" fill="#2a1d12"/>
<rect x="40" y="470" width="314" height="18" fill="#3c2a1b"/>
